services:
  # Backend API
  - type: web
    name: sistema-festas-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: event-images
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: static
    name: sistema-festas-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    publishPath: client/dist
    envVars:
      - key: VITE_API_BASE
        sync: false # Coloque aqui a URL do backend depois do primeiro deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

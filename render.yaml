services:
  - type: web
    name: sistema-festas-backend
    env: node
    region: oregon
    plan: free
    # O buildCommand agora garante que estamos na pasta certa e gera a pasta dist
    buildCommand: cd server && npm install && npm run build
    # O startCommand aponta para o caminho exato do arquivo gerado
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: event-images
    healthCheckPath: /api/health
